<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'ultima volta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0A0A0F; --fg:#F5F5F0; --ac:#FF3D00; --sc:#3D5AFE; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg); font-family:Inter,system-ui,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:grid; place-items:center; }
  #frame { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; }
  #frame canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #guides { pointer-events:none; }
  #loading { position:absolute; inset:0; display:grid; place-items:center; font:600 14px Inter,sans-serif; letter-spacing:.2em; color:#F5F5F088; }
  #ui { position:fixed; left:0; right:0; bottom:0; padding:14px 18px 12px; background:linear-gradient(transparent, #0A0A0FE6 35%); font-size:12px; user-select:none; transition:opacity .25s; }
  #ui.hidden { opacity:0; pointer-events:none; }
  #timeline { position:relative; height:34px; background:#F5F5F010; border-radius:3px; cursor:pointer; overflow:hidden; touch-action:none; }
  #segs { position:absolute; inset:0; display:flex; }
  .seg { position:relative; height:100%; border-right:1px solid #0A0A0F; background:#3D5AFE22; overflow:hidden; }
  .seg:nth-child(2n) { background:#3D5AFE38; }
  .seg span { position:absolute; left:6px; top:4px; font:600 10px Inter,sans-serif; letter-spacing:.08em; text-transform:uppercase; color:#F5F5F0AA; white-space:nowrap; }
  #progress { position:absolute; left:0; top:0; bottom:0; background:#FF3D0030; pointer-events:none; }
  #playhead { position:absolute; top:0; bottom:0; width:2px; background:#FF3D00; pointer-events:none; }
  #controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; }
  button, select, .file { background:#F5F5F012; color:var(--fg); border:1px solid #F5F5F030; border-radius:3px; padding:6px 10px; font:600 11px Inter,sans-serif; letter-spacing:.06em; cursor:pointer; }
  button:hover, .file:hover { background:#F5F5F025; }
  button.on { border-color:var(--ac); color:var(--ac); }
  .rec { background:#FF3D00; border-color:#FF3D00; color:#0A0A0F; }
  .file input { display:none; }
  #tc { font:600 15px "Space Grotesk",monospace; letter-spacing:.04em; min-width:90px; }
  #fr, #audioInfo, .hint { color:#F5F5F088; font-size:11px; }
  .hint { margin-left:auto; }
  #recBadge { position:fixed; top:14px; right:18px; font:600 12px Inter; color:#FF3D00; letter-spacing:.1em; display:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="video" width="1920" height="1080"></canvas>
    <canvas id="guides" width="1920" height="1080"></canvas>
    <div id="loading">CARICAMENTO FONT…</div>
  </div>
</div>
<div id="recBadge">● REGISTRAZIONE IN CORSO</div>
<div id="ui">
  <div id="timeline"><div id="segs"></div><div id="progress"></div><div id="playhead"></div></div>
  <div id="controls">
    <button id="bPlay">▶ PLAY</button>
    <span id="tc">00:00:00</span><span id="fr">FRAME 0 / 0</span>
    <button id="bLoop" class="on">LOOP ON</button>
    <select id="speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option></select>
    <label class="file">♪ AUDIO<input type="file" id="fAudio" accept="audio/*"></label><span id="audioInfo">nessun audio</span>
    <button id="bPng">PNG</button>
    <button id="bRec" class="rec">● REGISTRA</button>
    <span class="hint">SPAZIO play · ←/→ frame · ⇧+←/→ 1s · 1–9 scene · L loop · G safe zone · H nascondi UI</span>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   L'ULTIMA VOLTA — videoclip musicale procedurale (carta ritagliata)
   Tutto il video è una funzione pura del tempo: render(t).
   ===================================================================== */

// ─────────────────────────────────────────────────────────────────────
// CONFIG — parametri globali modificabili
// ─────────────────────────────────────────────────────────────────────
const CONFIG = {
  title: "L'ultima volta",       // titolo (anche nome del file esportato)
  duration: 90,                   // durata totale in secondi
  fps: 60,                        // frame al secondo (render + export)
  width: 1920, height: 1080,      // risoluzione nativa del canvas
  seed: 20190707,                 // seed del PRNG: cambia tutte le variazioni casuali
  bpm: 72,                        // tempo musicale: lento e contemplativo (1 beat = 0.833 s)
  palette: {
    bg: '#0A0A0F',                // sfondo
    primary: '#F5F5F0',           // primario (carta avorio)
    accent: '#FF3D00',            // accento (il filo rosso, il cerchio spezzato)
    secondary: '#3D5AFE'          // secondario (notte, mare)
  },
  type: {
    title: '"Space Grotesk", sans-serif',   // titoli: Space Grotesk Bold MAIUSCOLO
    body: 'Inter, sans-serif',              // testi: Inter Regular
    titleTracking: -0.035,                  // tracking stretto (frazione della dimensione)
    minSize: 48                             // dimensione minima dei testi in px
  },
  safe: { x: 192, y: 108 },       // margini della title-safe (10%) usati da tutti i testi
  camera: {
    shakeAmp: 6,                  // ampiezza camera a mano (px)
    shakeRot: 0.0035,             // rotazione camera a mano (rad)
    shakeFreq: 0.35               // frequenza del rumore della camera
  },
  motion: { S: 0.4, M: 0.8, L: 1.6 },   // durate standard del linguaggio di movimento
  fx: {
    grain: true, grainAmount: 0.10,     // grana animata tipo 16mm
    vignette: true, vignetteAmount: 0.62,
    bloom: true, bloomAmount: 0.32,     // glow (canvas offscreen + blur)
    chroma: true, chromaPx: 1.6,        // aberrazione cromatica leggera (px)
    scanlines: true, scanlineAlpha: 0.035,
    motionBlur: true,                   // motion blur dal movimento camera
    grading: true,                      // color grading per scena + neri "documentario"
    paperShadow: true,                  // ombre della carta ritagliata
    handheld: true                      // shake camera a mano
  },
  audio: { reactive: true, bassCutoff: 150 }  // reattività audio (inviluppi precalcolati)
};

// ─────────────────────────────────────────────────────────────────────
// SCENES — la timeline come dati.
// start/end in secondi assoluti. I keyframe usano il tempo LOCALE
// della scena (t = 0 all'inizio della scena) nel formato {t, prop, value, ease}.
// transitionIn: transizione dalla scena precedente, centrata su start.
// ─────────────────────────────────────────────────────────────────────
const SCENES = [
  // ── SCENA 1 · INNAMORATI (0–5 s) ─────────────────────────────────
  // Hook: cerchio rosso che esplode, taglio diagonale, si apre come due ante
  // e rivela la coppia sulla collina. Il filo rosso disegna un cuore.
  { id: 'innamorati', name: 'Innamorati', start: 0, end: 5,
    transitionIn: null,
    params: {
      figA: { x: 790, y: 830, s: 0.95 },     // figura A (avorio)
      figB: { x: 1130, y: 830, s: 0.92 },    // figura B (blu)
      heartSize: 4.2,                        // dimensione del cuore del filo
      hookAngle: -0.62,                      // angolo del taglio diagonale del cerchio
      grade: '#3D5AFE', gradeAmt: 0.10       // tinta del grading
    },
    keys: [
      { t: 0,   prop: 'cam.zoom', value: 1.14, ease: 'linear' },
      { t: 5.6, prop: 'cam.zoom', value: 1.02, ease: 'sineInOut' },
      { t: 0,   prop: 'cam.y', value: -10, ease: 'linear' },
      { t: 5.6, prop: 'cam.y', value: 10, ease: 'sineInOut' },

      { t: 0.8, prop: 'hook.slash', value: 1, ease: 'expoOut' },
      { t: 0.75, prop: 'hook.split', value: 0, ease: 'linear' },     // separazione delle metà
      { t: 1.0, prop: 'hook.split', value: 1, ease: 'backOut' },
      { t: 1.0, prop: 'hook.open', value: 0, ease: 'linear' },       // apertura "ad ante"
      { t: 2.0, prop: 'hook.open', value: 1, ease: 'expoInOut' },
      { t: 1.0, prop: 'reveal.r', value: 0, ease: 'linear' },        // mask reveal circolare
      { t: 2.0, prop: 'reveal.r', value: 1300, ease: 'expoInOut' },
      { t: 1.8, prop: 'figA.lean', value: 0, ease: 'linear' },

      { t: 2.0, prop: 'figA.head', value: 0, ease: 'linear' },
      { t: 3.6, prop: 'figA.head', value: 0.12, ease: 'sineInOut' },
      { t: 2.2, prop: 'figB.head', value: 0, ease: 'linear' },
      { t: 3.8, prop: 'figB.head', value: 0.10, ease: 'sineInOut' },
      { t: 1.4, prop: 'thread.heart', value: 0, ease: 'linear' },
      { t: 2.6, prop: 'thread.heart', value: 1, ease: 'backOut' },
      { t: 1.4, prop: 'thread.lift', value: 0, ease: 'linear' },
      { t: 2.8, prop: 'thread.lift', value: 200, ease: 'expoOut' }

    texts: [
      { type: 'doctag', text: 'ESTATE 2019', x: 192, y: 170, size: 48, in: 1.8, out: 4.3 },

      { type: 'body', text: 'in quattro capitoli', x: 198, y: 952, size: 48, in: 2.0, out: 4.3, dim: true }
    ]

  // ── SCENA 2 · IL TEMPO (5–15 s) ──────────────────────────────────
  // Time-lapse: sole e luna ruotano sul mare di carta, il contatore dei giorni
  // corre. Un orologio emerge dal mare e le lancette accelerano; zoom nel perno.
  { id: 'tempo', name: 'Il tempo', start: 5, end: 15,
    transitionIn: { type: 'circle', dur: 1.2, cx: 960, cy: 560 },
    params: {
      horizon: 640,            // linea d'orizzonte
      dayPeriod: 2.6,          // durata di un "giorno" nel time-lapse (s)
      dayAccel: 0.025,         // accelerazione del time-lapse
      waves: [                 // strati del mare: y base, ampiezza, frequenza, velocità, profondità, tono (bg→blu)
        { y: 660, a: 8,  f: 0.0042, sp: 0.9,  d: 0.35, tone: 0.20, sh: 0.4 },
        { y: 705, a: 12, f: 0.0036, sp: -1.1, d: 0.5,  tone: 0.28, sh: 0.6 },
        { y: 760, a: 16, f: 0.0031, sp: 1.3,  d: 0.65, tone: 0.37, sh: 0.8 },
        { y: 830, a: 22, f: 0.0026, sp: -1.5, d: 0.8,  tone: 0.47, sh: 1.0 },
        { y: 915, a: 28, f: 0.0022, sp: 1.7,  d: 1.1,  tone: 0.60, sh: 1.3 },
        { y: 1010, a: 34, f: 0.0018, sp: -1.9, d: 1.35, tone: 0.74, sh: 1.6 }
      ],
      boat: { x0: 1320, v: -28, wave: 2, s: 0.9 },   // barchetta di carta
      clockX: 960,             // posizione orologio (mondo)
      spin0: 0.04, spinK: 0.017,                    // giri lancetta = spin0·t + spinK·t³
      pages: { count: 44, start: 6.0, every: 0.085, life: 2.4 },  // fogli di calendario
      grade: '#3D5AFE', gradeAmt: 0.12
    },
    keys: [
      { t: 0,   prop: 'cam.x', value: -90, ease: 'linear' },
      { t: 6,   prop: 'cam.x', value: 50, ease: 'sineInOut' },
      { t: 8.5, prop: 'cam.x', value: 0, ease: 'cam' },
      { t: 0,   prop: 'cam.zoom', value: 1.06, ease: 'linear' },
      { t: 5.5, prop: 'cam.zoom', value: 1.0, ease: 'sineInOut' },
      { t: 10.6, prop: 'cam.zoom', value: 1.85, ease: 'expoIn' },
      { t: 0,   prop: 'clock.y', value: 1700, ease: 'linear' },
      { t: 4.6, prop: 'clock.y', value: 1700, ease: 'linear' },
      { t: 6.6, prop: 'clock.y', value: 540, ease: 'backOut' },
      { t: 4.6, prop: 'clock.rot', value: -0.25, ease: 'linear' },
      { t: 6.8, prop: 'clock.rot', value: 0, ease: 'spring' }
    ],
    texts: [
      { type: 'chapter', label: 'CAPITOLO I', title: 'IL TEMPO', x: 192, y: 150, in: 0.5, out: 3.6 },
      { type: 'counter', label: 'GIORNO', from: 1, to: 1095, x: 1728, y: 150, in: 0.8, out: 9.2, countIn: 1.0, countOut: 8.8, ease: 'expoIn' },
      { type: 'body', text: 'I giorni passavano come onde.', x: 192, y: 930, size: 56, in: 3.9, out: 7.9 }
    ]
  },

  // ── SCENA 3 · LE CREPE (15–40 s) ─────────────────────────────────
  // Interno notte. Zoom sui litigi, frammenti di carta rossa con le frasi,
  // crepe sul muro, lampada che oscilla. Lo schermo si strappa in due.
  { id: 'crepe', name: 'Le crepe', start: 15, end: 40,
    transitionIn: { type: 'zoom', dur: 1.2, fx: 960, fy: 540, depth: 16, startScale: 0.45 },
    params: {
      A: { x: 700, y: 890, s: 1.0 },
      B: { x: 1220, y: 890, s: 0.97 },
      splitGap: 46,                      // apertura dello strappo (px per lato)
      hits: [ { t: 3.6, a: 1 }, { t: 8.5, a: 1 }, { t: 13.0, a: 1.3 }, { t: 14.0, a: 0.8 }, { t: 14.4, a: 0.8 } ],  // accenti glitch
      lamp: { x: 960, top: -80, len: 370 },   // lampada a sospensione
      pic: { x: 470, y: 290, fallT: 14.3, floorY: 845,
             imps: [ { t: 3.6, a: 0.10 }, { t: 8.5, a: -0.22 }, { t: 13, a: 0.30 } ] }, // quadro storto che cade
      rainStart: 8.5,                    // la pioggia sul vetro inizia qui
      cracks: [ { t: 3.6, x: 600, y: 230 }, { t: 8.5, x: 1380, y: 280 }, { t: 13.0, x: 1000, y: 330 },
                { t: 14.0, x: 260, y: 600 }, { t: 14.4, x: 1640, y: 640 } ],
      grade: '#FF3D00', gradeAmt: 0.06
    },
    keys: [
      { t: 0,    prop: 'cam.zoom', value: 1.0, ease: 'linear' },
      { t: 3.0,  prop: 'cam.zoom', value: 1.0, ease: 'linear' },
      { t: 3.6,  prop: 'cam.zoom', value: 1.28, ease: 'expoOut' },
      { t: 8.2,  prop: 'cam.zoom', value: 1.3, ease: 'sineInOut' },
      { t: 12.5, prop: 'cam.zoom', value: 1.34, ease: 'sineInOut' },
      { t: 13.0, prop: 'cam.zoom', value: 1.0, ease: 'backOut' },
      { t: 19.5, prop: 'cam.zoom', value: 1.0, ease: 'linear' },
      { t: 25,   prop: 'cam.zoom', value: 1.12, ease: 'sineInOut' },
      { t: 0,    prop: 'cam.x', value: 0, ease: 'linear' },
      { t: 3.0,  prop: 'cam.x', value: 0, ease: 'linear' },
      { t: 3.6,  prop: 'cam.x', value: -260, ease: 'expoOut' },
      { t: 8.0,  prop: 'cam.x', value: -240, ease: 'sineInOut' },
      { t: 8.5,  prop: 'cam.x', value: 260, ease: 'expoInOut' },   // whip pan
      { t: 12.5, prop: 'cam.x', value: 240, ease: 'sineInOut' },
      { t: 13.0, prop: 'cam.x', value: 0, ease: 'expoOut' },
      { t: 0,    prop: 'cam.y', value: 0, ease: 'linear' },
      { t: 3.6,  prop: 'cam.y', value: -40, ease: 'expoOut' },
      { t: 13.0, prop: 'cam.y', value: 0, ease: 'expoOut' },
      { t: 0,    prop: 'cam.rot', value: 0, ease: 'linear' },
      { t: 3.6,  prop: 'cam.rot', value: -0.015, ease: 'expoOut' },
      { t: 8.5,  prop: 'cam.rot', value: 0.02, ease: 'expoInOut' },
      { t: 13.0, prop: 'cam.rot', value: 0, ease: 'expoOut' },
      { t: 0,    prop: 'cam.shake', value: 1, ease: 'linear' },
      { t: 3.6,  prop: 'cam.shake', value: 2.2, ease: 'expoOut' },
      { t: 13.2, prop: 'cam.shake', value: 3.0, ease: 'expoOut' },
      { t: 19.5, prop: 'cam.shake', value: 0.5, ease: 'sineInOut' },
      { t: 0,    prop: 'split', value: 0, ease: 'linear' },
      { t: 13.0, prop: 'split', value: 0, ease: 'linear' },
      { t: 13.7, prop: 'split', value: 1, ease: 'backOut' },
      // figura A
      { t: 0,    prop: 'figA.lean', value: 0, ease: 'linear' },
      { t: 3.2,  prop: 'figA.lean', value: -0.04, ease: 'sineInOut' },  // anticipazione
      { t: 3.6,  prop: 'figA.lean', value: 0.12, ease: 'backOut' },
      { t: 6.5,  prop: 'figA.lean', value: 0.10, ease: 'linear' },
      { t: 7.4,  prop: 'figA.lean', value: 0.02, ease: 'sineInOut' },
      { t: 13.0, prop: 'figA.lean', value: 0.05, ease: 'sineInOut' },
      { t: 14.0, prop: 'figA.lean', value: 0.10, ease: 'backOut' },
      { t: 17.0, prop: 'figA.lean', value: 0.06, ease: 'sineInOut' },
      { t: 19.5, prop: 'figA.lean', value: -0.02, ease: 'sineInOut' },
      { t: 0,    prop: 'figA.arm1', value: 0.15, ease: 'linear' },
      { t: 3.2,  prop: 'figA.arm1', value: -0.2, ease: 'sineInOut' },
      { t: 3.6,  prop: 'figA.arm1', value: 1.6, ease: 'backOut' },
      { t: 6.8,  prop: 'figA.arm1', value: 1.4, ease: 'sineInOut' },
      { t: 7.4,  prop: 'figA.arm1', value: 0.3, ease: 'cubicInOut' },
      { t: 13.6, prop: 'figA.arm1', value: 0.1, ease: 'sineInOut' },
      { t: 14.0, prop: 'figA.arm1', value: 1.9, ease: 'backOut' },
      { t: 17.5, prop: 'figA.arm1', value: 0.2, ease: 'cubicInOut' },
      { t: 0,    prop: 'figA.arm2', value: 0.2, ease: 'linear' },
      { t: 3.6,  prop: 'figA.arm2', value: 0.1, ease: 'backOut' },
      { t: 7.4,  prop: 'figA.arm2', value: 0.6, ease: 'cubicInOut' },
      { t: 14.0, prop: 'figA.arm2', value: -0.3, ease: 'backOut' },
      { t: 17.5, prop: 'figA.arm2', value: 0.3, ease: 'cubicInOut' },
      { t: 0,    prop: 'figA.head', value: 0, ease: 'linear' },
      { t: 3.6,  prop: 'figA.head', value: -0.08, ease: 'backOut' },
      { t: 7.4,  prop: 'figA.head', value: 0.05, ease: 'sineInOut' },
      { t: 8.5,  prop: 'figA.head', value: 0.10, ease: 'sineInOut' },
      { t: 19.5, prop: 'figA.head', value: 0.10, ease: 'linear' },
      { t: 21.0, prop: 'figA.head', value: 0.22, ease: 'sineInOut' },
      { t: 0,    prop: 'figA.flip', value: 1, ease: 'linear' },
      { t: 21.0, prop: 'figA.flip', value: 1, ease: 'linear' },
      { t: 21.8, prop: 'figA.flip', value: -1, ease: 'cubicInOut' },
      // figura B
      { t: 0,    prop: 'figB.lean', value: 0, ease: 'linear' },
      { t: 3.6,  prop: 'figB.lean', value: -0.06, ease: 'backOut' },
      { t: 8.2,  prop: 'figB.lean', value: -0.04, ease: 'sineInOut' },
      { t: 8.5,  prop: 'figB.lean', value: 0.12, ease: 'backOut' },
      { t: 11.0, prop: 'figB.lean', value: 0.08, ease: 'sineInOut' },
      { t: 11.6, prop: 'figB.lean', value: 0, ease: 'sineInOut' },
      { t: 14.4, prop: 'figB.lean', value: 0.10, ease: 'backOut' },
      { t: 17.0, prop: 'figB.lean', value: 0.05, ease: 'sineInOut' },
      { t: 19.5, prop: 'figB.lean', value: -0.02, ease: 'sineInOut' },
      { t: 0,    prop: 'figB.arm1', value: 0.1, ease: 'linear' },
      { t: 8.2,  prop: 'figB.arm1', value: -0.3, ease: 'sineInOut' },
      { t: 8.5,  prop: 'figB.arm1', value: 1.5, ease: 'backOut' },
      { t: 11.3, prop: 'figB.arm1', value: 1.3, ease: 'sineInOut' },
      { t: 11.8, prop: 'figB.arm1', value: 0.2, ease: 'cubicInOut' },
      { t: 14.0, prop: 'figB.arm1', value: 0.0, ease: 'sineInOut' },
      { t: 14.4, prop: 'figB.arm1', value: 1.8, ease: 'backOut' },
      { t: 17.5, prop: 'figB.arm1', value: 0.15, ease: 'cubicInOut' },
      { t: 0,    prop: 'figB.arm2', value: 0.3, ease: 'linear' },
      { t: 8.5,  prop: 'figB.arm2', value: 0.2, ease: 'backOut' },
      { t: 11.8, prop: 'figB.arm2', value: 0.5, ease: 'cubicInOut' },
      { t: 14.4, prop: 'figB.arm2', value: -0.2, ease: 'backOut' },
      { t: 17.5, prop: 'figB.arm2', value: 0.35, ease: 'cubicInOut' },
      { t: 0,    prop: 'figB.head', value: 0, ease: 'linear' },

// ─────────────────────────────────────────────────────────────────────
// SCENA 5 · ADDIO
// ─────────────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────────────
// SCENA 6 · FINE

const RENDERERS = { innamorati: drawS1, tempo: drawS2, crepe: drawS3, ultima: drawS4, addio: drawS5, fine: drawS6 };

// ─────────────────────────────────────────────────────────────────────
// TRANSIZIONI RIUTILIZZABILI (A = uscente, B = entrante, p = 0..1)
// ─────────────────────────────────────────────────────────────────────
function drawScaled(ctx, img, z, fx, fy, alpha = 1) { ctx.setTransform(z, 0, 0, z, fx - fx * z, fy - fy * z); ctx.globalAlpha = alpha; ctx.drawImage(img, 0, 0); ctx.globalAlpha = 1; ident(ctx); }
const TRANSITIONS = {
  dissolve(ctx, A, B, p) { ctx.drawImage(A, 0, 0); ctx.globalAlpha = E.sineInOut(p); ctx.drawImage(B, 0, 0); ctx.globalAlpha = 1; },
  // wipe a strappo di carta diagonale
  wipe(ctx, A, B, p) {
    ctx.drawImage(A, 0, 0); const x = lerp(-500, W + 500, E.cubicInOut(p));
    ctx.save(); ctx.beginPath(); ctx.moveTo(-10, -10);
    for (let i = 0; i <= 30; i++) { const y = i / 30 * (H + 20) - 10; ctx.lineTo(x + (i / 30 - 0.5) * 300 + (hash(i, 3) - 0.5) * 30, y); }
    ctx.lineTo(-10, H + 10); ctx.closePath(); ctx.clip(); ctx.drawImage(B, 0, 0); ctx.restore();
  },
  // mask reveal circolare con anello accento
  circle(ctx, A, B, p, o) {
    ctx.drawImage(A, 0, 0); const e = E.expoInOut(p), r = e * Math.hypot(W, H) * 0.75;
    if (r > 0.5) { ctx.save(); ctx.beginPath(); ctx.arc(o.cx, o.cy, r, 0, TAU); ctx.clip(); ctx.drawImage(B, 0, 0); ctx.restore();
      ctx.strokeStyle = P.accent; ctx.lineWidth = 10 * (1 - e) + 2; ctx.globalAlpha = 1 - e * 0.8; ctx.beginPath(); ctx.arc(o.cx, o.cy, r, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
  },
  // zoom dentro un oggetto (con zoom blur) e B che emerge da un cerchio
  zoom(ctx, A, B, p, o) {
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    const e = E.expoIn(clamp(p / 0.62)), z = 1 + e * o.depth;
    if (p < 0.75) { drawScaled(ctx, A, z, o.fx, o.fy); if (e > 0.02) { drawScaled(ctx, A, z * 1.04, o.fx, o.fy, 0.3); drawScaled(ctx, A, z * 1.09, o.fx, o.fy, 0.18); } }

    }

  },
  // morph: la maschera passa da cerchio a rettangolo pieno

  }
};

// ─────────────────────────────────────────────────────────────────────
// AUDIO (inviluppi precalcolati → reattività deterministica)
// ─────────────────────────────────────────────────────────────────────
const AUDIO = { el: null, ctx: null, dest: null, env: null, name: '' };
function energy(t, band = 'rms') {
  if (CONFIG.audio.reactive && AUDIO.env) { const arr = AUDIO.env[band]; return arr[clamp(Math.floor(t * FPS), 0, arr.length - 1)]; }
  return 0.25 + 0.35 * onBeat(t, 4) * (band === 'bass' ? 1 : 0.7);
}

// ─────────────────────────────────────────────────────────────────────
// RENDER(t) — funzione pura del tempo
// ─────────────────────────────────────────────────────────────────────
const VIDEO = document.getElementById('video'), OUT = VIDEO.getContext('2d');
let BUF, BCTX, BA, ACTX, BB, BBCTX, B2, B2CTX, CH = [], BL, BLCTX;
function sceneIndexAt(t) { let i = 0; for (let k = 0; k < SCENES.length; k++) if (t >= SCENES[k].start) i = k; return i; }
// azzera TUTTO lo stato del contesto: nessuno stato deve passare da un frame all'altro
const NO_DASH = [];
function resetCtx(ctx) {
  ident(ctx); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter'; ctx.lineWidth = 1; ctx.miterLimit = 10; ctx.setLineDash(NO_DASH); ctx.lineDashOffset = 0;
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic'; ctx.font = '10px sans-serif';
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; ctx.shadowColor = 'rgba(0,0,0,0)';
  ctx.imageSmoothingEnabled = true;
}
function drawScene(ctx, S, t) {
  resetCtx(ctx); const lt = t - S.start;
  const anch = RENDERERS[S.id](ctx, lt, S, t);
  resetCtx(ctx); drawTexts(ctx, S, lt, t, anch); resetCtx(ctx);
}
function sceneFx(S, t) {
  const lt = t - S.start, pr = S.params;
  return { glitch: hitsAt(pr.hits, lt), desat: kf(S, 'fx.desat', lt), flash: kf(S, 'fx.flash', lt), fade: kf(S, 'fx.fade', lt), grade: pr.grade, gradeAmt: pr.gradeAmt };
}
function camShift(S, t) { const c = camOf(S, t - S.start, t); return [-c.x * c.zoom + c.sx, -c.y * c.zoom + c.sy]; }

function render(tIn) {
  const t = clamp(tIn, 0, DUR - 1e-6);
  const i = sceneIndexAt(t), S = SCENES[i], next = SCENES[i + 1];
  let trans = null;
  if (i > 0 && S.transitionIn && t < S.start + S.transitionIn.dur / 2) trans = { A: SCENES[i - 1], B: S, tr: S.transitionIn };
  else if (next && next.transitionIn && t >= next.start - next.transitionIn.dur / 2) trans = { A: S, B: next, tr: next.transitionIn };
  let fx;
  if (trans) {
    const p = clamp((t - (trans.B.start - trans.tr.dur / 2)) / trans.tr.dur);
    drawScene(ACTX, trans.A, t); drawScene(BBCTX, trans.B, t);
    resetCtx(BCTX); TRANSITIONS[trans.tr.type](BCTX, BA, BB, p, trans.tr, t); resetCtx(BCTX);
    const fa = sceneFx(trans.A, t), fb = sceneFx(trans.B, t);
    fx = { glitch: lerp(fa.glitch, fb.glitch, p) + (trans.tr.type === 'glitch' ? Math.sin(p * Math.PI) : 0), desat: lerp(fa.desat, fb.desat, p), flash: lerp(fa.flash, fb.flash, p), fade: lerp(fa.fade, fb.fade, p), grade: p < 0.5 ? fa.grade : fb.grade, gradeAmt: lerp(fa.gradeAmt, fb.gradeAmt, p) };
  } else { drawScene(BCTX, S, t); fx = sceneFx(S, t); }
  post(t, fx, S);
}

// POST-PRODUZIONE: motion blur → glitch → aberrazione → bloom → grading → vignetta → scanline → grana
function post(t, fx, S) {
  let src = BUF;
  if (FX.motionBlur) {
    const a = camShift(S, t), b = camShift(S, t - 1 / FPS); let vx = clamp(a[0] - b[0], -40, 40), vy = clamp(a[1] - b[1], -40, 40);
    if (Math.abs(vx) + Math.abs(vy) > 2.5) {
      resetCtx(B2CTX); B2CTX.drawImage(BUF, 0, 0);
      for (let k = 1; k <= 4; k++) { B2CTX.globalAlpha = 0.45 / (k + 0.4); B2CTX.drawImage(BUF, -vx * k / 4, -vy * k / 4); }
      B2CTX.globalAlpha = 1; src = B2;
    }
  }
  if (fx.glitch > 0.02) {
    const g = Math.min(1.4, fx.glitch), dst = src === BUF ? B2CTX : BCTX, dcan = src === BUF ? B2 : BUF;
    resetCtx(dst); dst.drawImage(src, 0, 0); const fb = Math.floor(t * 24);
    for (let i = 0; i < 18; i++) { if (hash(i, fb * 5) > g * 0.9) continue; const y = hash(i, fb * 5 + 1) * H, h = 6 + hash(i, fb * 5 + 2) * 90, off = (hash(i, fb * 5 + 3) - 0.5) * 180 * g; dst.drawImage(src, 0, y, W, h, off, y, W, h); }
    src = dcan;
  }
  resetCtx(OUT);
  const ca = FX.chroma ? FX.chromaPx + fx.glitch * 14 : 0;
  if (ca > 0.3) {
    const cols = ['#FF0000', '#00FF00', '#0000FF'];
    for (let c = 0; c < 3; c++) { const cx = CH[c].getContext('2d'); resetCtx(cx); cx.drawImage(src, 0, 0); cx.globalCompositeOperation = 'multiply'; cx.fillStyle = cols[c]; cx.fillRect(0, 0, W, H); cx.globalCompositeOperation = 'source-over'; }
    OUT.fillStyle = '#000'; OUT.fillRect(0, 0, W, H); OUT.globalCompositeOperation = 'lighter';
    OUT.drawImage(CH[0], -ca, -ca * 0.56, W + 2 * ca, H + ca * 1.12); OUT.drawImage(CH[1], 0, 0); OUT.drawImage(CH[2], ca, ca * 0.56, W - 2 * ca, H - ca * 1.12);
    OUT.globalCompositeOperation = 'source-over';
  } else OUT.drawImage(src, 0, 0);
  if (FX.bloom && 'filter' in BLCTX) {
    resetCtx(BLCTX); BLCTX.clearRect(0, 0, BL.width, BL.height);
    BLCTX.filter = 'brightness(0.85) contrast(2.4) blur(6px)'; BLCTX.drawImage(VIDEO, 0, 0, BL.width, BL.height); BLCTX.filter = 'none';
    OUT.globalCompositeOperation = 'screen'; OUT.globalAlpha = FX.bloomAmount * (0.8 + 0.5 * energy(t, 'bass')); OUT.drawImage(BL, 0, 0, W, H);
    OUT.globalAlpha = 1; OUT.globalCompositeOperation = 'source-over';
  }
  if (FX.grading) {
    if (fx.desat > 0.001) { OUT.globalCompositeOperation = 'saturation'; OUT.globalAlpha = fx.desat; OUT.fillStyle = '#808080'; OUT.fillRect(0, 0, W, H); }
    if (fx.gradeAmt > 0) { OUT.globalCompositeOperation = 'soft-light'; OUT.globalAlpha = fx.gradeAmt; OUT.fillStyle = fx.grade; OUT.fillRect(0, 0, W, H); }
    OUT.globalCompositeOperation = 'lighten'; OUT.globalAlpha = 1; OUT.fillStyle = P.bg; OUT.fillRect(0, 0, W, H); // neri "documentario"
    OUT.globalCompositeOperation = 'source-over';
  }
  if (fx.flash > 0.001) { OUT.globalCompositeOperation = 'screen'; OUT.globalAlpha = fx.flash; OUT.fillStyle = P.primary; OUT.fillRect(0, 0, W, H); OUT.globalCompositeOperation = 'source-over'; OUT.globalAlpha = 1; }
  if (fx.fade > 0.001) { OUT.globalAlpha = fx.fade; OUT.fillStyle = P.bg; OUT.fillRect(0, 0, W, H); OUT.globalAlpha = 1; }
  if (FX.vignette) { OUT.globalAlpha = CONFIG.fx.vignetteAmount; OUT.drawImage(VIGN, 0, 0); OUT.globalAlpha = 1; }
  if (FX.scanlines) { OUT.globalAlpha = FX.scanlineAlpha; OUT.fillStyle = SCAN; OUT.fillRect(0, 0, W, H); OUT.globalAlpha = 1; }
  if (FX.grain) {
    const f = Math.round(t * FPS), ox = Math.floor(hash(f, 1) * 256), oy = Math.floor(hash(f, 2) * 256);
    OUT.globalCompositeOperation = 'overlay'; OUT.globalAlpha = FX.grainAmount * 1.6; OUT.fillStyle = GRAIN[f % GRAIN.length];
    OUT.translate(-ox, -oy); OUT.fillRect(ox, oy, W, H); resetCtx(OUT);
  }
}

// ─────────────────────────────────────────────────────────────────────
// PLAYER
// ─────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const GUIDES = $('guides'), GCTX = GUIDES.getContext('2d');
const ST = { T: 0, playing: false, speed: 1, loop: true, last: 0, rendered: -1, recording: false, ui: true, guides: false, rec: null, chunks: [], mime: '' };
const frameOf = t => Math.min(Math.round(t * FPS), Math.round(DUR * FPS) - 1);
const quant = t => frameOf(t) / FPS;

function buildTimeline() {
  const segs = $('segs');
  SCENES.forEach((S, i) => { const d = document.createElement('div'); d.className = 'seg'; d.style.width = ((S.end - S.start) / DUR * 100) + '%'; d.innerHTML = `<span>${i + 1} · ${S.name}</span>`; segs.appendChild(d); });
  const tl = $('timeline'); let drag = false;
  const setFromX = e => { const r = tl.getBoundingClientRect(); seek(clamp((e.clientX - r.left) / r.width) * DUR); };
  tl.addEventListener('pointerdown', e => { drag = true; tl.setPointerCapture(e.pointerId); setFromX(e); });
  tl.addEventListener('pointermove', e => { if (drag) setFromX(e); });
  tl.addEventListener('pointerup', () => { drag = false; });
}
function seek(t) { ST.T = clamp(t, 0, DUR - 1 / FPS); if (AUDIO.el && AUDIO.el.src) { try { AUDIO.el.currentTime = Math.min(ST.T, AUDIO.el.duration || ST.T); } catch (e) { } } }
function play() { if (ST.playing) return; if (ST.T >= DUR - 1 / FPS) seek(0); ST.playing = true; ST.last = performance.now(); if (AUDIO.el && AUDIO.el.src) { if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume(); AUDIO.el.playbackRate = ST.speed; AUDIO.el.currentTime = ST.T; AUDIO.el.play().catch(() => { }); } $('bPlay').textContent = '❚❚ PAUSA'; }
function pause() { ST.playing = false; if (AUDIO.el) AUDIO.el.pause(); $('bPlay').textContent = '▶ PLAY'; }
function step(frames) { pause(); seek(quant(ST.T) + frames / FPS); }
function updateUI() {
  const f = frameOf(ST.T), s = Math.floor(f / FPS), ff = f % FPS;
  $('tc').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}:${String(ff).padStart(2, '0')}`;
  $('fr').textContent = `FRAME ${f} / ${Math.round(DUR * FPS) - 1}`;
  const pc = (ST.T / DUR * 100) + '%'; $('playhead').style.left = pc; $('progress').style.width = pc;
}
function drawGuides() {
  GCTX.clearRect(0, 0, W, H); if (!ST.guides) return;
  GCTX.lineWidth = 2; GCTX.font = '600 18px Inter, sans-serif';
  GCTX.strokeStyle = '#3D5AFE'; GCTX.strokeRect(W * 0.05, H * 0.05, W * 0.9, H * 0.9); GCTX.fillStyle = '#3D5AFE'; GCTX.fillText('ACTION SAFE 90%', W * 0.05 + 8, H * 0.05 + 24);
  GCTX.strokeStyle = '#FF3D00'; GCTX.strokeRect(CONFIG.safe.x, CONFIG.safe.y, W - 2 * CONFIG.safe.x, H - 2 * CONFIG.safe.y); GCTX.fillStyle = '#FF3D00'; GCTX.fillText('TITLE SAFE 80% (testi)', CONFIG.safe.x + 8, CONFIG.safe.y + 24);
  // ritaglio 9:16 centrale per Reels/TikTok con le aree coperte dall'interfaccia
  const cw = H * 9 / 16, cx = (W - cw) / 2; GCTX.setLineDash([10, 8]); GCTX.strokeStyle = '#F5F5F0'; GCTX.strokeRect(cx, 0, cw, H); GCTX.setLineDash([]);
  GCTX.fillStyle = 'rgba(245,245,240,0.12)'; GCTX.fillRect(cx, 0, cw, H * 0.12); GCTX.fillRect(cx, H * 0.78, cw, H * 0.22); GCTX.fillRect(cx + cw * 0.86, H * 0.35, cw * 0.14, H * 0.43);
  GCTX.fillStyle = '#F5F5F0'; GCTX.fillText('CROP 9:16 · UI TikTok/Reels', cx + 8, H * 0.12 + 24);
  GCTX.strokeStyle = 'rgba(245,245,240,0.4)'; GCTX.beginPath(); GCTX.moveTo(W / 2 - 20, H / 2); GCTX.lineTo(W / 2 + 20, H / 2); GCTX.moveTo(W / 2, H / 2 - 20); GCTX.lineTo(W / 2, H / 2 + 20); GCTX.stroke();
}
function tick(now) {
  requestAnimationFrame(tick);
  if (ST.playing) {
    const dt = Math.min(0.1, (now - ST.last) / 1000); ST.last = now; ST.T += dt * ST.speed;
    if (AUDIO.el && AUDIO.el.src && !AUDIO.el.paused && ST.speed === 1 && AUDIO.el.currentTime < (AUDIO.el.duration || 0) - 0.05) {
      if (Math.abs(AUDIO.el.currentTime - ST.T) > 0.08) ST.T = AUDIO.el.currentTime; // l'audio fa da master clock
    }
    if (ST.T >= DUR) {
      if (ST.recording) { ST.T = DUR - 1 / FPS; render(ST.T); ST.rendered = frameOf(ST.T); stopRecording(); return; }
      if (ST.loop) { seek(0); if (AUDIO.el && AUDIO.el.src) AUDIO.el.play().catch(() => { }); }
      else { ST.T = DUR - 1 / FPS; pause(); }
    }
  }
  const f = frameOf(ST.T);
  if (f !== ST.rendered) { render(f / FPS); ST.rendered = f; }
  updateUI();
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
const fileBase = () => CONFIG.title.replace(/[\\/:*?"<>|]/g, '_');
function startRecording() {
  if (ST.recording) return;
  if (!window.MediaRecorder || !VIDEO.captureStream) { alert('MediaRecorder non supportato da questo browser.'); return; }
  pause(); seek(0); ST.rendered = -1;
  const stream = VIDEO.captureStream(FPS);
  if (AUDIO.dest) AUDIO.dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  const hasAudio = !!AUDIO.dest;
  const cands = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
    ? (hasAudio ? ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1,opus', 'video/mp4;codecs=avc1'] : ['video/mp4;codecs=avc1'])
    : (hasAudio ? ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp9', 'video/webm'] : ['video/webm;codecs=vp9', 'video/webm']);
  ST.mime = cands.find(m => MediaRecorder.isTypeSupported(m)) || '';
  ST.chunks = [];
  ST.rec = new MediaRecorder(stream, ST.mime ? { mimeType: ST.mime, videoBitsPerSecond: 20e6 } : { videoBitsPerSecond: 20e6 });
  ST.rec.ondataavailable = e => { if (e.data && e.data.size) ST.chunks.push(e.data); };
  ST.rec.onstop = () => { const type = ST.mime.split(';')[0] || 'video/webm'; download(new Blob(ST.chunks, { type }), fileBase() + (type.includes('mp4') ? '.mp4' : '.webm')); };
  ST.recording = true; ST.speed = 1; $('speed').value = '1'; ST.guides = false; drawGuides();
  $('ui').classList.add('hidden'); $('recBadge').style.display = 'block';
  render(0); ST.rendered = 0;
  ST.rec.start(250); play();
}
function stopRecording() {
  ST.recording = false; pause();
  if (ST.rec && ST.rec.state !== 'inactive') ST.rec.stop();
  $('recBadge').style.display = 'none'; if (ST.ui) $('ui').classList.remove('hidden');
}
function exportPNG() { VIDEO.toBlob(b => download(b, `${fileBase()}_frame${String(frameOf(ST.T)).padStart(4, '0')}.png`), 'image/png'); }

async function loadAudio(file) {
  if (!AUDIO.ctx) {
    AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AUDIO.el = new Audio(); AUDIO.el.preload = 'auto';
    const srcNode = AUDIO.ctx.createMediaElementSource(AUDIO.el);
    AUDIO.dest = AUDIO.ctx.createMediaStreamDestination();
    srcNode.connect(AUDIO.ctx.destination); srcNode.connect(AUDIO.dest);
  }
  pause();
  AUDIO.el.src = URL.createObjectURL(file); AUDIO.name = file.name;
  $('audioInfo').textContent = 'analisi audio…';
  try {
    const ab = await AUDIO.ctx.decodeAudioData(await file.arrayBuffer());
    AUDIO.env = await computeEnvelope(ab);
    $('audioInfo').textContent = `${file.name} · ${ab.duration.toFixed(1)} s · reattivo`;
  } catch (e) { AUDIO.env = null; $('audioInfo').textContent = `${file.name} (analisi non riuscita)`; }
  ST.rendered = -1; seek(ST.T);
}
// inviluppi per frame: RMS generale + banda bassi (lowpass in OfflineAudioContext)
async function computeEnvelope(ab) {
  const n = Math.round(DUR * FPS), sr = ab.sampleRate, spf = sr / FPS;
  const chans = []; for (let c = 0; c < ab.numberOfChannels; c++) chans.push(ab.getChannelData(c));
  const rmsOf = (datas) => {
    const out = new Float32Array(n);
    for (let f = 0; f < n; f++) {
      const s0 = Math.floor(f * spf), s1 = Math.min(datas[0].length, Math.floor((f + 1) * spf)); let sum = 0, cnt = 0;
      for (let s = s0; s < s1; s++) { let v = 0; for (const d of datas) v += d[s]; v /= datas.length; sum += v * v; cnt++; }
      out[f] = cnt ? Math.sqrt(sum / cnt) : 0;
    }
    const sorted = Float32Array.from(out).sort(), ref = sorted[Math.floor(n * 0.97)] || 1;
    for (let f = 0; f < n; f++) out[f] = Math.min(1, out[f] / (ref || 1));
    for (let f = 1; f < n; f++) out[f] = Math.max(out[f], out[f - 1] * 0.9); // rilascio morbido (precalcolato)
    return out;
  };
  const rms = rmsOf(chans);
  const off = new OfflineAudioContext(1, ab.length, sr), src = off.createBufferSource(), lp = off.createBiquadFilter();
  src.buffer = ab; lp.type = 'lowpass'; lp.frequency.value = CONFIG.audio.bassCutoff; src.connect(lp); lp.connect(off.destination); src.start();
  const rendered = await off.startRendering();
  const bass = rmsOf([rendered.getChannelData(0)]);
  return { rms, bass };
}

function bindUI() {
  $('bPlay').onclick = () => ST.playing ? pause() : play();
  $('bLoop').onclick = () => { ST.loop = !ST.loop; $('bLoop').textContent = ST.loop ? 'LOOP ON' : 'LOOP OFF'; $('bLoop').classList.toggle('on', ST.loop); };
  $('speed').onchange = e => { ST.speed = parseFloat(e.target.value); if (AUDIO.el) AUDIO.el.playbackRate = ST.speed; };
  $('bPng').onclick = exportPNG;
  $('bRec').onclick = startRecording;
  $('fAudio').onchange = e => { const f = e.target.files[0]; if (f) loadAudio(f); };
  addEventListener('keydown', e => {
    if (ST.recording) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) e.target.blur();
    const k = e.code;
    if (k === 'Space') { e.preventDefault(); ST.playing ? pause() : play(); }
    else if (k === 'ArrowRight') { e.preventDefault(); step(e.shiftKey ? FPS : 1); }
    else if (k === 'ArrowLeft') { e.preventDefault(); step(e.shiftKey ? -FPS : -1); }
    else if (k === 'KeyH') { ST.ui = !ST.ui; $('ui').classList.toggle('hidden', !ST.ui); }
    else if (k === 'KeyG') { ST.guides = !ST.guides; drawGuides(); }
    else if (k === 'KeyL') $('bLoop').click();
    else if (/^Digit[1-9]$/.test(k)) { const i = parseInt(k.slice(5)) - 1; if (SCENES[i]) seek(SCENES[i].start); }
  });
}

// ─────────────────────────────────────────────────────────────────────
// AVVIO: attende i font prima del primo render
// ─────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    await Promise.all([document.fonts.load(`700 120px ${FT}`), document.fonts.load(`400 56px ${FB}`), document.fonts.load(`600 56px ${FB}`)]);
    await document.fonts.ready;
  } catch (e) { /* in caso di rete assente si usano i fallback */ }
  BUF = mkCanvas(W, H); BCTX = BUF.getContext('2d');
  BA = mkCanvas(W, H); ACTX = BA.getContext('2d');
  BB = mkCanvas(W, H); BBCTX = BB.getContext('2d');
  B2 = mkCanvas(W, H); B2CTX = B2.getContext('2d');
  CH = [mkCanvas(W, H), mkCanvas(W, H), mkCanvas(W, H)];
  BL = mkCanvas(W / 4, H / 4); BLCTX = BL.getContext('2d');
  indexKeys(); buildTextures(OUT); buildGradients(OUT); buildGeometry(); prepTexts(); MCACHE.clear();
  buildTimeline(); bindUI();
  $('loading').remove();
  window.render = render; window.CONFIG = CONFIG; window.SCENES = SCENES; window.__ready = true;
  requestAnimationFrame(tick);
}
boot();
</script>
